# Streamlit Community Cloud: conda-forge RDKit (Cairo-enabled) + pip extras.
# numpy<2 is required: pip otherwise installs numpy 2.x and breaks conda RDKit binaries.
name: ligand-map-viewer
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy>=1.26,<2
  - rdkit>=2023.09.5
  - pandas>=2.0,<3
  - requests>=2.28
  - biopython>=1.81
  - pip
  - pip:
      - numpy>=1.26,<2
      - pandas>=2.0,<3
      - streamlit>=1.28,<2
      - streamlit-aggrid>=1.0
      - py3Dmol>=2.0.1
