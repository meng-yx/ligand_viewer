# Streamlit Community Cloud: conda-forge RDKit (Cairo-enabled) + pip extras.
# Takes precedence over requirements.txt when main file is ligand_map_viewer/app.py
name: ligand-map-viewer
channels:
  - conda-forge
dependencies:
  - python=3.11
  - rdkit>=2023.09.5
  - pandas>=2.0
  - requests>=2.28
  - biopython>=1.81
  - pip
  - pip:
      - streamlit>=1.28,<2
      - streamlit-aggrid>=1.0
      - py3Dmol>=2.0.1
